<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050510; 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Звездный фон, который растянут на весь сайт */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0; /* Фон сзади */
            pointer-events: none;
        }

        /* Контент (текст и карточки) поверх звезд */
        .content {
            position: relative;
            z-index: 1;
        }

        /* Экран 1: Главный */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .hero h1 { 
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(4rem, 12vw, 9rem); 
            line-height: 0.9;
            text-transform: uppercase;
            color: transparent;
            -webkit-text-stroke: 2px #fff;
            letter-spacing: -2px;
        }

        .hero h1 span {
            color: #fff;
            -webkit-text-stroke: 0;
        }

        .hero p {
            font-size: 1.2rem;
            color: #888;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 20px;
        }

        .btn {
            margin-top: 50px;
            padding: 20px 60px;
            font-family: 'Unbounded', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #000;
            background: #fff;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
        
        .btn:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 20px 40px rgba(255,255,255,0.4);
        }

        /* Экран 2: Услуги (Карточки) */
        .services {
            min-height: 100vh;
            padding: 100px 5%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            width: 340px;
            height: 420px;
            /* Полупрозрачный фон, чтобы сквозь него было видно звезды */
            background: rgba(20, 20, 35, 0.6); 
            backdrop-filter: blur(8px); /* Легкое размытие фона под карточкой */
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 30px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s, background 0.3s, border-color 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(30, 30, 45, 0.8);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .card h2 { 
            font-family: 'Unbounded', sans-serif;
            font-size: 1.8rem; 
            margin-bottom: 10px;
            word-wrap: break-word; /* Защита от вылезания длинных слов */
        }
        
        .card p {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .card .price { 
            font-family: 'Unbounded', sans-serif;
            font-size: 3.5rem; 
            font-weight: 900; 
            color: #ff9a9e; 
            line-height: 1;
        }

        /* Подвал */
        footer {
            text-align: center;
            padding: 50px 0;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.5); /* Чтобы текст читался на фоне */
        }
    </style>
</head>
<body>

    <!-- Фон со звездами на весь экран -->
    <div id="canvas-container"></div>

    <div class="content">
        <section class="hero">
            <h1>NAIL<br><span>STUDIO</span></h1>
            <p>Premium Care</p>
            <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>
        </section>

        <section class="services">
            <div class="card">
                <div>
                    <h2>Маникюр</h2>
                    <p>Аппаратный и комбинированный маникюр с премиальным покрытием.</p>
                </div>
                <div class="price">2 000</div>
            </div>
            
            <div class="card">
                <div>
                    <h2>Наращивание</h2>
                    <p>Моделирование любой формы и длины. Идеальная архитектура.</p>
                </div>
                <div class="price">3 500</div>
            </div>

            <div class="card">
                <div>
                    <h2>Дизайн</h2>
                    <p>Сложная роспись, инкрустация камнями и модные эффекты.</p>
                </div>
                <div class="price">150</div>
            </div>
        </section>

        <footer>
            <p>+7 (999) 123-45-67</p>
            <p style="margin-top: 10px;">МОСКВА | 2026</p>
        </footer>
    </div>

    <!-- Three.js для космоса -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GSAP для анимации карточек -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        // --- КОСМОС (ЗВЕЗДЫ) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 4000;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 50; // Разбрасываем звезды шире
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.06,
            color: 0xffffff,
            transparent: true,
            opacity: 0.8
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);
        camera.position.z = 5;

        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 2 - camera.position.y) * 0.05;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- АНИМАЦИЯ ПРИ ПРОКРУТКЕ ---
        gsap.registerPlugin(ScrollTrigger);

        // Карточки плавно вылетают при прокрутке
        gsap.from(".card", {
            scrollTrigger: {
                trigger: ".services",
                start: "top 80%",
                end: "bottom 60%",
                scrub: 1
            },
            y: 150,
            opacity: 0,
            stagger: 0.2 // Появляются друг за другом
        });
    </script>
</body>
</html>
