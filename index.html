<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | Fast 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050510; 
            color: #fff; 
            font-family: 'Unbounded', sans-serif;
            overflow-x: hidden;
        }

        /* Главный экран */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle, #1a1a2e 0%, #050510 100%);
        }
        
        .hero h1 { 
            font-size: clamp(4rem, 12vw, 10rem); 
            line-height: 0.9;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 50px rgba(255,255,255,0.5);
        }

        .btn {
            margin-top: 50px;
            padding: 25px 80px;
            font-size: 1.5rem;
            font-weight: 900;
            color: #000;
            background: #fff;
            border-radius: 100px;
            text-decoration: none;
            transition: all 0.4s;
            box-shadow: 0 0 50px rgba(255,255,255,0.3);
        }
        
        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 100px rgba(255,255,255,0.8);
        }

        /* Экран услуг */
        .services {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 100px 20px;
            flex-wrap: wrap;
            perspective: 1500px;
        }

        /* КАРТОЧКА */
        .card {
            width: 320px;
            height: 420px;
            background: #111118; /* Плотный фон, чтобы текст не сливался */
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.15s ease-out, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden; /* Ничего не вылезет за края */
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }

        /* Контент внутри карточки */
        .card-content {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transform: translateZ(30px); /* Легкий подъем текста */
        }

        .card h2 { 
            font-size: 1.8rem; 
            line-height: 1.2;
            word-wrap: break-word; /* Перенос длинных слов */
        }
        
        .card .price { 
            font-size: 4rem; 
            font-weight: 900; 
            color: #ff9a9e; 
            line-height: 1;
        }

        .card p {
            color: #888;
            font-size: 0.85rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1>NAIL<br>STUDIO</h1>
        <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>
    </section>

    <section class="services">
        <div class="card">
            <div class="card-content">
                <h2>Маникюр</h2>
                <p>Премиальный уход</p>
                <div class="price">2 000</div>
            </div>
        </div>
        <div class="card">
            <div class="card-content">
                <h2>Наращивание</h2>
                <p>Идеальная архитектура</p>
                <div class="price">3 500</div>
            </div>
        </div>
        <div class="card">
            <div class="card-content">
                <h2>Дизайн</h2>
                <p>Роспись и камни</p>
                <div class="price">150</div>
            </div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Анимация при прокрутке (без размытия)
        gsap.from(".card", {
            scrollTrigger: {
                trigger: ".services",
                start: "top bottom",
                end: "center center",
                scrub: true
            },
            y: 100,
            opacity: 0,
            rotationY: 30,
            stagger: 0.1
        });

        // Быстрый и четкий 3D-эффект (без transition, чтобы не тормозило)
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                // Угол наклона (максимум 15 градусов)
                const rotateX = ((y - centerY) / centerY) * -15;
                const rotateY = ((x - centerX) / centerX) * 15;
                
                // Применяем трансформацию мгновенно
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
            });

            card.addEventListener('mouseleave', () => {
                // Возвращаем на место с легкой задержкой
                card.style.transition = 'transform 0.3s ease';
                card.style.transform = `rotateX(0) rotateY(0) scale(1)`;
            });

            card.addEventListener('mouseenter', () => {
                // Убираем задержку при входе, чтобы двигалось моментально за мышкой
                card.style.transition = 'none';
            });
        });
    </script>
</body>
</html>
