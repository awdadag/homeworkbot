<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | Flying Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050510; 
            color: #fff; 
            font-family: 'Unbounded', sans-serif;
            overflow: hidden; /* Убираем скролл, чтобы все летало в одном окне */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер, в котором все летает */
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1500px; /* Глубина 3D */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Летающие карточки */
        .flying-card {
            position: absolute;
            width: 300px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            backdrop-filter: blur(15px);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0; /* Изначально невидимы */
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            transform-style: preserve-3d;
        }

        .flying-card h2 { font-size: 2rem; }
        .flying-card .price { font-size: 4rem; font-weight: 900; color: #ff9a9e; }

        /* Заголовок */
        .main-title {
            position: absolute;
            z-index: 10;
            text-align: center;
            opacity: 0;
            transform: scale(0.5);
        }

        .main-title h1 {
            font-size: clamp(4rem, 12vw, 10rem); 
            line-height: 0.9;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 50px rgba(255,255,255,0.8), 0 0 100px rgba(255, 154, 158, 0.5);
        }

        .btn {
            position: absolute;
            bottom: 10%;
            padding: 20px 60px;
            font-size: 1.2rem;
            font-weight: 900;
            font-family: 'Unbounded', sans-serif;
            color: #000;
            background: #fff;
            border-radius: 100px;
            text-decoration: none;
            opacity: 0;
            z-index: 10;
            box-shadow: 0 0 40px rgba(255,255,255,0.4);
            transition: transform 0.3s;
        }
        
        .btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- Заголовок, который появится в центре -->
        <div class="main-title">
            <h1>NAIL<br>STUDIO</h1>
        </div>

        <!-- Карточки, которые летят с краев -->
        <div class="flying-card card-1">
            <h2>Маникюр</h2>
            <div class="price">2 000</div>
        </div>
        
        <div class="flying-card card-2">
            <h2>Наращивание</h2>
            <div class="price">3 500</div>
        </div>

        <!-- Кнопка -->
        <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>
    </div>

    <!-- Подключаем GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script>
        const tl = gsap.timeline();

        // 1. Карточки вылетают с разных сторон в центр
        tl.to(".card-1", {
            opacity: 1,
            x: -150, // Сдвиг влево от центра
            y: -50,
            rotationY: 25,
            rotationX: 10,
            duration: 1.5,
            ease: "power4.out"
        }, 0)
        
        .to(".card-2", {
            opacity: 1,
            x: 150, // Сдвиг вправо от центра
            y: 50,
            rotationY: -25,
            rotationX: -10,
            duration: 1.5,
            ease: "power4.out"
        }, 0)
        
        // 2. Заголовок выпрыгивает из-за карточек
        .to(".main-title", {
            opacity: 1,
            scale: 1,
            duration: 1,
            ease: "back.out(1.5)"
        }, 1) // Начинается через 1 секунду
        
        // 3. Кнопка появляется снизу
        .to(".btn", {
            opacity: 1,
            y: -20,
            duration: 0.8,
            ease: "power2.out"
        }, 1.5);

        // 4. Эффект параллакса для карточек при движении мыши
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 30;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 30;

            // Заголовок слегка двигается
            gsap.to(".main-title", {
                rotationY: xAxis,
                rotationX: yAxis,
                duration: 0.5,
                ease: "power1.out"
            });

            // Карточки двигаются сильнее (эффект объема)
            gsap.to(".card-1", {
                rotationY: 25 + xAxis * 1.5,
                rotationX: 10 + yAxis * 1.5,
                duration: 0.5,
                ease: "power1.out"
            });
            
            gsap.to(".card-2", {
                rotationY: -25 + xAxis * 1.5,
                rotationX: -10 + yAxis * 1.5,
                duration: 0.5,
                ease: "power1.out"
            });
        });
    </script>
</body>
</html>
