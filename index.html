<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | Cosmos 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Unbounded', sans-serif;
            overflow-x: hidden;
        }

        /* 3D Канвас на весь экран */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            pointer-events: none; /* Чтобы мышка проходила сквозь текст к 3D */
        }

        /* Блок 1: Главный экран */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .hero h1 { 
            font-size: clamp(4rem, 12vw, 10rem); 
            line-height: 0.9;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff 0%, #555 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 3s infinite alternate;
        }

        .hero p {
            font-size: 1.5rem;
            color: #888;
            margin-top: 20px;
            letter-spacing: 10px;
        }

        /* Кнопка */
        .btn {
            pointer-events: auto;
            margin-top: 50px;
            padding: 25px 80px;
            font-size: 1.5rem;
            font-family: 'Unbounded', sans-serif;
            font-weight: 900;
            color: #000;
            background: #fff;
            border-radius: 100px;
            text-decoration: none;
            transition: all 0.4s;
            box-shadow: 0 0 50px rgba(255,255,255,0.3);
        }
        
        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 100px rgba(255,255,255,0.8);
        }

        /* Блок 2: Услуги, которые летают вокруг */
        .services {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2000px;
        }

        .card {
            pointer-events: auto;
            width: 400px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 40px;
            margin: 20px;
            backdrop-filter: blur(20px);
            transform-style: preserve-3d;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* При наведении карточка вылетает вперед */
        .card:hover {
            transform: scale(1.2) translateZ(100px) rotateY(10deg);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 100px rgba(0,0,0,0.8);
        }

        .card h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #fff;
        }

        .card .price {
            font-size: 4rem;
            font-weight: 900;
            color: #ff9a9e;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; text-shadow: 0 0 50px rgba(255,255,255,0.5); }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="content">
        <section class="hero">
            <h1>NAIL<br>STUDIO</h1>
            <p>EXTREME 3D EXPERIENCE</p>
            <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>
        </section>

        <section class="services">
            <div class="card">
                <h2>Маникюр</h2>
                <div class="price">2 000</div>
            </div>
            <div class="card">
                <h2>Наращивание</h2>
                <div class="price">3 500</div>
            </div>
        </section>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');

        // Настройка сцены
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Создаем СВЕТЯЩИЙСЯ ШАР (как планета)
        const geometry = new THREE.SphereGeometry(3, 64, 64);
        const material = new THREE.MeshStandardMaterial({
            color: 0xff9a9e,
            emissive: 0xff9a9e,
            emissiveIntensity: 0.5,
            roughness: 0.2,
            metalness: 0.8
        });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // Добавляем кольца вокруг (как у Сатурна)
        const ringGeo = new THREE.TorusGeometry(5, 0.1, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        scene.add(ring);

        // Освещение
        const light1 = new THREE.PointLight(0xffffff, 2, 100);
        light1.position.set(10, 10, 10);
        scene.add(light1);

        const light2 = new THREE.PointLight(0xff9a9e, 2, 100);
        light2.position.set(-10, -10, 10);
        scene.add(light2);

        camera.position.z = 15;

        // Анимация
        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate() {
            requestAnimationFrame(animate);
            
            // Вращение
            sphere.rotation.y += 0.01;
            ring.rotation.z += 0.01;

            // Реакция на мышку (камера летит)
            camera.position.x += (mouseX * 5 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 5 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
