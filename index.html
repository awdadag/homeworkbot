<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | Space 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050510; 
            color: #fff; 
            font-family: 'Unbounded', sans-serif;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* Контейнер для 3D-звезд */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none; /* Чтобы мышка проходила сквозь звезды к карточкам */
        }

        .content {
            position: relative;
            z-index: 1;
        }

        /* Главный экран */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .hero h1 { 
            font-size: clamp(4rem, 12vw, 10rem); 
            line-height: 0.9;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 50px rgba(255,255,255,0.5);
        }

        .btn {
            margin-top: 50px;
            padding: 25px 80px;
            font-size: 1.5rem;
            font-weight: 900;
            color: #000;
            background: #fff;
            border-radius: 100px;
            text-decoration: none;
            transition: all 0.4s;
            box-shadow: 0 0 50px rgba(255,255,255,0.3);
            pointer-events: auto;
        }
        
        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 100px rgba(255,255,255,0.8);
        }

        /* Экран услуг */
        .services {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 100px 20px;
            flex-wrap: wrap;
        }

        /* КАРТОЧКА */
        .card {
            width: 320px;
            height: 420px;
            background: rgba(20, 20, 30, 0.8); /* Темный фон, чтобы выделяться на звездах */
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.1s ease-out, border-color 0.3s, box-shadow 0.3s;
            position: relative;
            cursor: pointer;
            backdrop-filter: blur(5px); /* Легкое стекло, но без сильного размытия текста */
            pointer-events: auto;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* Текст */
        .card h2 { 
            font-size: 1.8rem; 
            line-height: 1.2;
            word-wrap: break-word;
            color: #fff;
            text-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }
        
        .card .price { 
            font-size: 4.5rem; 
            font-weight: 900; 
            color: #ff9a9e; 
            line-height: 1;
            margin-top: 10px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }

        .card p {
            color: #aaa;
            font-size: 0.85rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Фон со звездами -->
    <div id="canvas-container"></div>

    <div class="content">
        <section class="hero">
            <h1>NAIL<br>STUDIO</h1>
            <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>
        </section>

        <section class="services">
            <div class="card">
                <div>
                    <h2>Маникюр</h2>
                    <p>Премиальный уход</p>
                </div>
                <div class="price">2 000</div>
            </div>
            <div class="card">
                <div>
                    <h2>Наращивание</h2>
                    <p>Идеальная архитектура</p>
                </div>
                <div class="price">3 500</div>
            </div>
            <div class="card">
                <div>
                    <h2>Дизайн</h2>
                    <p>Роспись и камни</p>
                </div>
                <div class="price">150</div>
            </div>
        </section>
    </div>

    <!-- Three.js для космоса -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GSAP для анимаций -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        // --- 3D КОСМОС (ЗВЕЗДЫ) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.02); // Туман для глубины
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Создаем звезды
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 3000;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 30; // Разбрасываем по ширине
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.05,
            color: 0xffffff,
            transparent: true,
            opacity: 0.8
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        camera.position.z = 5;

        // Движение мышки для параллакса звезд
        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            particlesMesh.rotation.x += 0.0005;

            // Камера плавно летит за мышкой
            camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 2 - camera.position.y) * 0.05;

            renderer.render(scene, camera);
        }
        animate();

        // Ресайз окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- АНИМАЦИЯ КАРТОЧЕК ---
        gsap.registerPlugin(ScrollTrigger);

        // Плавный вылет карточек
        gsap.from(".card", {
            scrollTrigger: {
                trigger: ".services",
                start: "top bottom",
                end: "center center",
                scrub: true
            },
            y: 100,
            opacity: 0,
            rotationY: 15,
            stagger: 0.1
        });

        // Быстрый 3D-наклон карточек
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -15;
                const rotateY = ((x - centerX) / centerX) * 15;
                
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transition = 'transform 0.3s ease';
                card.style.transform = `rotateX(0) rotateY(0) scale(1)`;
            });

            card.addEventListener('mouseenter', () => {
                card.style.transition = 'none';
            });
        });
    </script>
</body>
</html>
