<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | 3D Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Unbounded', sans-serif; 
            background: #050505; 
            color: #fff; 
            overflow-x: hidden;
        }

        /* Канвас для 3D фона */
        #webgl {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        .container { 
            position: relative;
            z-index: 1; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 20px; 
        }

        /* Шапка */
        header { 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        header h1 { 
            font-size: clamp(3rem, 8vw, 7rem); 
            font-weight: 900; 
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 1;
            background: linear-gradient(135deg, #fff 0%, #a5a5a5 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }
        header p { 
            font-size: 1.2rem; 
            font-weight: 300; 
            color: #888; 
            margin-top: 20px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        /* Кнопка */
        .btn {
            margin-top: 50px;
            padding: 20px 50px;
            font-size: 1rem;
            font-family: 'Unbounded', sans-serif;
            font-weight: 600;
            color: #000;
            background: #fff;
            border: none;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(255,255,255,0.6);
        }

        /* Блок услуг */
        .services { padding: 100px 0; }
        .services-title { 
            font-size: 3rem; 
            font-weight: 900; 
            margin-bottom: 80px; 
            text-align: center;
            text-transform: uppercase;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 40px; 
            perspective: 2000px; 
        }

        /* Жесткие 3D карточки */
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 30px;
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease, box-shadow 0.3s ease;
            will-change: transform;
            backdrop-filter: blur(10px);
        }
        .card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .card h3 { 
            font-size: 1.5rem; 
            font-weight: 600; 
            color: #fff; 
            transform: translateZ(50px); 
        }
        .card .price { 
            font-size: 3rem; 
            font-weight: 900; 
            color: #a5a5a5; 
            margin: 20px 0;
            transform: translateZ(40px);
        }
        .card p { 
            color: #666; 
            font-size: 0.9rem; 
            line-height: 1.6;
            transform: translateZ(20px);
        }

        /* Подвал */
        footer { 
            text-align: center; 
            padding: 80px 0; 
            border-top: 1px solid rgba(255,255,255,0.1); 
            color: #555;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 3D Фон -->
    <canvas id="webgl"></canvas>

    <header>
        <h1>NAIL<br>STUDIO</h1>
        <p>Премиум уход</p>
        <a href="https://t.me/твой_бот" class="btn" target="_blank">Записаться</a>
    </header>

    <div class="container">
        <section class="services">
            <h2 class="services-title">Услуги</h2>
            <div class="grid">
                <div class="card">
                    <h3>Маникюр</h3>
                    <div class="price">2000 ₽</div>
                    <p>Аппаратный, комбинированный</p>
                </div>
                <div class="card">
                    <h3>Наращивание</h3>
                    <div class="price">3500 ₽</div>
                    <p>Гель, акригель, коррекция</p>
                </div>
                <div class="card">
                    <h3>Дизайн</h3>
                    <div class="price">150 ₽</div>
                    <p>Роспись, инкрустация камнями</p>
                </div>
            </div>
        </section>
    </div>

    <footer>
        <p>Работаем ежедневно с 10:00 до 20:00</p>
        <p>Телефон: +7 (999) 123-45-67</p>
    </footer>

    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // === 3D СЦЕНА ===
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl'), alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Создаем жесткий 3D-объект (Тор с гранями)
        const geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
        const material = new THREE.MeshNormalMaterial({ 
            wireframe: true, 
            transparent: true, 
            opacity: 0.15 
        });
        const torus = new THREE.Mesh(geometry, material);
        scene.add(torus);

        camera.position.z = 30;

        // Движение мыши для параллакса
        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // Анимация
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Вращение 3D объекта
            torus.rotation.y = elapsedTime * 0.2;
            torus.rotation.x = elapsedTime * 0.1;

            // Плавное следование за мышкой
            torus.position.x += (mouseX * 5 - torus.position.x) * 0.05;
            torus.position.y += (mouseY * 5 - torus.position.y) * 0.05;

            renderer.render(scene, camera);
        }
        animate();

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // === 3D ЭФФЕКТ ДЛЯ КАРТОЧЕК ===
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -15;
                const rotateY = ((x - centerX) / centerX) * 15;
                
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = `rotateX(0) rotateY(0) scale(1)`;
            });
        });
    </script>
</body>
</html>
