<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050510; 
            color: #fff; 
            font-family: 'Unbounded', sans-serif;
            overflow-x: hidden;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle, #1a1a2e 0%, #050510 100%);
        }
        
        .hero h1 { 
            font-size: clamp(4rem, 12vw, 10rem); 
            line-height: 0.9;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 50px rgba(255,255,255,0.5);
        }

        .hero p {
            font-size: 1.5rem;
            color: #888;
            margin-top: 20px;
            letter-spacing: 10px;
        }

        .btn {
            margin-top: 50px;
            padding: 25px 80px;
            font-size: 1.5rem;
            font-family: 'Unbounded', sans-serif;
            font-weight: 900;
            color: #000;
            background: #fff;
            border-radius: 100px;
            text-decoration: none;
            transition: all 0.4s;
            box-shadow: 0 0 50px rgba(255,255,255,0.3);
        }
        
        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 100px rgba(255,255,255,0.8);
        }

        .services {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            padding: 100px 20px;
            flex-wrap: wrap;
            background: #050510;
        }

        .card {
            width: 350px;
            height: 450px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            padding: 40px;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-20px);
            background: rgba(255, 255, 255, 0.1);
        }

        .card h2 { font-size: 2rem; }
        .card .price { font-size: 4rem; font-weight: 900; color: #ff9a9e; }
    </style>
</head>
<body>

    <section class="hero">
        <h1>NAIL<br>STUDIO</h1>
        <p>PREMIUM CARE</p>
        <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>
    </section>

    <section class="services">
        <div class="card">
            <h2>Маникюр</h2>
            <div class="price">2 000</div>
        </div>
        <div class="card">
            <h2>Наращивание</h2>
            <div class="price">3 500</div>
        </div>
        <div class="card">
            <h2>Дизайн</h2>
            <div class="price">150</div>
        </div>
    </section>

    <!-- Подключаем GSAP для анимации -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Текст улетает вглубь при скролле
        gsap.to(".hero", {
            scrollTrigger: {
                trigger: ".hero",
                start: "top top",
                end: "bottom top",
                scrub: true
            },
            scale: 0.5,
            opacity: 0,
            y: -200
        });

        // Карточки вылетают с разных сторон
        gsap.from(".card", {
            scrollTrigger: {
                trigger: ".services",
                start: "top bottom",
                end: "center center",
                scrub: true
            },
            y: 200,
            opacity: 0,
            rotation: 10,
            stagger: 0.2
        });
    </script>
</body>
</html>
