<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | Space 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050510; 
            color: #fff; 
            font-family: 'Unbounded', sans-serif;
            overflow: hidden; /* Запрещаем скролл, все на одном экране */
        }

        /* Контейнер для 3D-звезд */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Главный экран (все элементы тут) */
        .hero {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1500px; /* Глубина для полета карточек */
        }

        /* Огромное название по центру */
        .main-title { 
            font-size: clamp(5rem, 15vw, 14rem); 
            line-height: 0.8;
            text-transform: uppercase;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255,255,255,0.8); /* Прозрачные буквы с обводкой */
            position: absolute;
            text-align: center;
            z-index: 0;
            user-select: none;
        }

        .main-title span {
            color: #fff;
            -webkit-text-stroke: 0;
        }

        /* Карточки, которые летают вокруг */
        .card {
            position: absolute;
            width: 300px;
            height: 380px;
            background: rgba(15, 15, 25, 0.4); /* Прозрачный фон, чтобы видеть звезды сквозь карточку */
            backdrop-filter: blur(10px); /* Легкое размытие фона под карточкой */
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            pointer-events: auto;
            /* Плавный переход для возврата в исходное состояние */
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            transform-style: preserve-3d;
        }

        /* Расположение карточек вокруг центра */
        .card:nth-child(1) { transform: translate3d(-350px, -100px, 0) rotateZ(-5deg); }
        .card:nth-child(2) { transform: translate3d(350px, -100px, 0) rotateZ(5deg); }
        .card:nth-child(3) { transform: translate3d(0px, 250px, 0) rotateZ(0deg); }

        /* Эффект при наведении (карточка вылетает вперед) */
        .card:hover {
            background: rgba(30, 30, 45, 0.7);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 30px rgba(255,255,255,0.1);
            transform: translate3d(var(--x), var(--y), 100px) scale(1.05) rotateZ(0deg) !important;
            z-index: 10;
        }

        /* Текст внутри карточек */
        .card h2 { 
            font-size: 1.8rem; 
            line-height: 1.2;
            word-wrap: break-word;
            color: #fff;
        }
        
        .card .price { 
            font-size: 4.5rem; 
            font-weight: 900; 
            color: #ff9a9e; 
            line-height: 1;
            text-shadow: 0 0 20px rgba(255,154,158,0.3);
        }

        .card p {
            color: #aaa;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* Кнопка записи */
        .btn {
            position: absolute;
            bottom: 50px;
            z-index: 5;
            padding: 20px 60px;
            font-size: 1.2rem;
            font-weight: 900;
            color: #000;
            background: #fff;
            border-radius: 100px;
            text-decoration: none;
            transition: all 0.4s;
            box-shadow: 0 0 50px rgba(255,255,255,0.3);
        }
        
        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 100px rgba(255,255,255,0.8);
        }

        /* Мобильная адаптация */
        @media (max-width: 1024px) {
            .card:nth-child(1) { transform: translate3d(-150px, -250px, 0) rotateZ(-5deg) scale(0.8); }
            .card:nth-child(2) { transform: translate3d(150px, -250px, 0) rotateZ(5deg) scale(0.8); }
            .card:nth-child(3) { transform: translate3d(0px, 50px, 0) rotateZ(0deg) scale(0.8); }
            .main-title { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <!-- Фон со звездами -->
    <div id="canvas-container"></div>

    <section class="hero">
        <!-- Огромное название на фоне -->
        <h1 class="main-title">NAIL<br><span>STUDIO</span></h1>

        <!-- Карточки, которые летают -->
        <div class="card" style="--x: -350px; --y: -100px;">
            <div>
                <h2>Маникюр</h2>
                <p>Премиальный уход</p>
            </div>
            <div class="price">2 000</div>
        </div>
        
        <div class="card" style="--x: 350px; --y: -100px;">
            <div>
                <h2>Наращивание</h2>
                <p>Идеальная архитектура</p>
            </div>
            <div class="price">3 500</div>
        </div>

        <div class="card" style="--x: 0px; --y: 250px;">
            <div>
                <h2>Дизайн</h2>
                <p>Роспись и камни</p>
            </div>
            <div class="price">150</div>
        </div>

        <!-- Кнопка -->
        <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>
    </section>

    <!-- Three.js для космоса -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 3D КОСМОС (ЗВЕЗДЫ) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.02); 
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 4000;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 40; 
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.06,
            color: 0xffffff,
            transparent: true,
            opacity: 0.8
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        camera.position.z = 5;

        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            
            // Камера летит за мышкой
            camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 2 - camera.position.y) * 0.05;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- ЖЕСТКИЙ 3D НАКЛОН КАРТОЧЕК ПРИ НАВЕДЕНИИ ---
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -20;
                const rotateY = ((x - centerX) / centerX) * 20;
                
                // Сохраняем позицию карточки, но добавляем наклон
                const baseX = card.style.getPropertyValue('--x') || '0px';
                const baseY = card.style.getPropertyValue('--y') || '0px';
                
                card.style.transform = `translate3d(${baseX}, ${baseY}, 50px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
            });

            card.addEventListener('mouseleave', () => {
                // Возвращаем на место
                const baseX = card.style.getPropertyValue('--x') || '0px';
                const baseY = card.style.getPropertyValue('--y') || '0px';
                card.style.transform = `translate3d(${baseX}, ${baseY}, 0) rotateX(0) rotateY(0) scale(1)`;
            });
        });
    </script>
</body>
</html>
