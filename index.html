<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | Orbit 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #030305; 
            color: #fff; 
            font-family: 'Unbounded', sans-serif;
            overflow-x: hidden;
        }

        /* ЭКРАН 1: Полет */
        .intro {
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            overflow: hidden;
        }

        .center-text {
            text-align: center;
            z-index: 10;
            opacity: 0;
            transform: scale(0.8);
            animation: textAppear 1.5s forwards 0.5s;
        }

        .center-text h1 {
            font-size: clamp(4rem, 10vw, 8rem);
            line-height: 0.8;
            text-shadow: 0 0 40px rgba(255,255,255,0.8);
        }

        .center-text p {
            font-size: 1.2rem;
            margin-top: 20px;
            color: #888;
            letter-spacing: 5px;
        }

        /* КАРТОЧКИ (Орбита) */
        .orbit-card {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 250px;
            height: 350px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            backdrop-filter: blur(15px);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: translate(-50%, -50%);
            opacity: 0;
            z-index: 5;
        }

        .orbit-card h2 { font-size: 1.5rem; }
        .orbit-card .price { font-size: 3rem; font-weight: 900; color: #ff9a9e; }

        /* Анимация появления текста */
        @keyframes textAppear {
            to { opacity: 1; transform: scale(1); }
        }

        /* ЭКРАН 2: Куда прилетают */
        .bottom-section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            background: #030305;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .static-card {
            width: 300px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transform: translateY(100px);
            transition: all 1s ease;
        }
        .static-card h2 { font-size: 2rem; }
        .static-card .price { font-size: 4rem; font-weight: 900; color: #ff9a9e; }

        /* Класс для появления при скролле */
        .visible {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }
    </style>
</head>
<body>

    <!-- Экран 1 -->
    <div class="intro">
        <div class="center-text">
            <h1>NAIL<br>STUDIO</h1>
            <p>+7 (999) 123-45-67</p>
        </div>

        <div class="orbit-card card-1">
            <h2>Маникюр</h2>
            <div class="price">2 000</div>
        </div>
        <div class="orbit-card card-2">
            <h2>Наращивание</h2>
            <div class="price">3 500</div>
        </div>
    </div>

    <!-- Экран 2 -->
    <div class="bottom-section">
        <div class="static-card" id="dest-1">
            <h2>Маникюр</h2>
            <div class="price">2 000</div>
        </div>
        <div class="static-card" id="dest-2">
            <h2>Наращивание</h2>
            <div class="price">3 500</div>
        </div>
    </div>

    <script>
        // Ждем загрузки страницы
        window.addEventListener('load', () => {
            const card1 = document.querySelector('.card-1');
            const card2 = document.querySelector('.card-2');
            const intro = document.querySelector('.intro');

            // 1. Вылет карточек с краев (через 1 секунду)
            setTimeout(() => {
                card1.style.transition = 'all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                card2.style.transition = 'all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                
                // Ставим их по бокам
                card1.style.opacity = '1';
                card1.style.transform = 'translate(-150%, -50%) rotateY(-30deg)';
                
                card2.style.opacity = '1';
                card2.style.transform = 'translate(50%, -50%) rotateY(30deg)';
            }, 1000);

            // 2. КРУЖЕНИЕ вокруг названия (через 2.5 секунды)
            setTimeout(() => {
                // Делаем переход более плавным
                card1.style.transition = 'all 3s linear';
                card2.style.transition = 'all 3s linear';

                // Задаем бесконечное вращение (эмуляция орбиты через сдвиг)
                card1.style.transform = 'translate(-50%, -150%) rotateY(360deg) scale(0.8)';
                card2.style.transform = 'translate(-50%, 100%) rotateY(-360deg) scale(0.8)';
            }, 2500);

            // 3. УЛЕТ ВНИЗ (через 5.5 секунд)
            setTimeout(() => {
                card1.style.transition = 'all 1s ease-in';
                card2.style.transition = 'all 1s ease-in';

                card1.style.transform = 'translate(-50%, 150vh) rotateY(720deg)';
                card2.style.transform = 'translate(-50%, 150vh) rotateY(-720deg)';
            }, 5500);
        });

        // 4. ПОЯВЛЕНИЕ КАРТОЧЕК ПРИ СКРОЛЛЕ
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.2 }); // Срабатывает, когда карточка показывается на 20%

        document.querySelectorAll('.static-card').forEach(card => {
            observer.observe(card);
        });
    </script>
</body>
</html>
