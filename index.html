<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | Orbit</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #030308; 
            color: #fff; 
            font-family: 'Unbounded', sans-serif;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
        }

        .intro {
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 10;
        }

        /* НАЗВАНИЕ */
        .center-block {
            text-align: center;
            z-index: 10;
            opacity: 0; 
            transform: scale(0.5) translateZ(-500px);
            filter: blur(10px);
        }

        .center-block h1 {
            font-size: clamp(4rem, 12vw, 9rem);
            line-height: 0.8;
            text-transform: uppercase;
            text-shadow: 0 0 50px rgba(255,255,255,0.8);
            margin-bottom: 20px;
        }

        /* НОМЕР ТЕЛЕФОНА (Кликабельный) */
        .phone {
            font-size: 1.5rem;
            color: #fff;
            letter-spacing: 2px;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.1);
            display: inline-block;
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: background 0.3s;
            pointer-events: auto; /* Чтобы кликалось */
        }
        .phone:hover { background: rgba(255,255,255,0.2); }

        .btn {
            display: inline-block;
            padding: 20px 60px;
            font-size: 1.2rem;
            font-weight: 900;
            color: #000;
            background: #fff;
            border-radius: 100px;
            text-decoration: none;
            box-shadow: 0 0 40px rgba(255,255,255,0.4);
            transition: transform 0.3s;
            pointer-events: auto;
        }
        .btn:hover { transform: scale(1.1); }

        /* КАРТОЧКИ */
        .card {
            position: absolute;
            top: 50%; left: 50%;
            width: 280px; height: 380px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            z-index: 5;
            opacity: 0; 
            transform: translate(-50%, -50%) scale(0);
        }

        .card h2 { font-size: 1.5rem; }
        .card .price { font-size: 3.5rem; font-weight: 900; color: #fff; }

        /* НИЖНИЙ БЛОК */
        .bottom-section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            position: relative;
            z-index: 20;
        }

        .static-card {
            width: 300px; height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0; 
            transform: translateY(150px);
            transition: all 1s ease;
            backdrop-filter: blur(10px);
        }
        .static-card h2 { font-size: 2rem; }
        .static-card .price { font-size: 4rem; font-weight: 900; color: #fff; }

        .visible {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="intro">
        <!-- Название, телефон, кнопка -->
        <div class="center-block">
            <h1>NAIL<br>STUDIO</h1>
            <div class="phone" id="phone-number">+7 (999) 123-45-67</div>
            <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>
        </div>

        <!-- Карточки -->
        <div class="card card-1">
            <h2>Маникюр</h2>
            <div class="price">2 000</div>
        </div>
        <div class="card card-2">
            <h2>Наращивание</h2>
            <div class="price">3 500</div>
        </div>
    </div>

    <div class="bottom-section">
        <div class="static-card" id="dest-1">
            <h2>Маникюр</h2>
            <div class="price">2 000</div>
        </div>
        <div class="static-card" id="dest-2">
            <h2>Наращивание</h2>
            <div class="price">3 500</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // КОСМОС
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030308, 0.03); 
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 5000;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 50;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.1, color: 0xffffff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending 
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);
        camera.position.z = 5;

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            camera.position.x += (mouseX * 3 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 3 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }
        animate();

        // === КОПИРОВАНИЕ НОМЕРА ===
        const phone = document.getElementById('phone-number');
        phone.addEventListener('click', () => {
            const number = phone.innerText;
            navigator.clipboard.writeText(number).then(() => {
                // Меняем текст на время, чтобы показать, что скопировалось
                const originalText = phone.innerText;
                phone.innerText = "Скопировано!";
                phone.style.background = "rgba(255,255,255,0.3)";
                
                setTimeout(() => {
                    phone.innerText = originalText;
                    phone.style.background = "rgba(255,255,255,0.1)";
                }, 1500);
            });
        });

        // === АНИМАЦИЯ ===
        const card1 = document.querySelector('.card-1');
        const card2 = document.querySelector('.card-2');
        const centerBlock = document.querySelector('.center-block');

        // 1. Появление названия
        setTimeout(() => {
            centerBlock.style.transition = 'all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            centerBlock.style.opacity = '1';
            centerBlock.style.transform = 'scale(1) translateZ(0)';
            centerBlock.style.filter = 'blur(0px)';
        }, 500);

        // 2. Симметричный вылет карточек
        setTimeout(() => {
            card1.style.transition = 'transform 0.8s ease-out, opacity 0.8s';
            card2.style.transition = 'transform 0.8s ease-out, opacity 0.8s';
            
            // Обе карточки на одинаковом расстоянии от центра (300px)
            card1.style.opacity = '1';
            card1.style.transform = 'translate(-200%, -50%) scale(1)';
            
            card2.style.opacity = '1';
            card2.style.transform = 'translate(100%, -50%) scale(1)';
        }, 1500);

        // 3. Кружение (радиус увеличен)
        let orbitTime = 0;
        let isOrbiting = false;

        function orbit() {
            if (!isOrbiting) return;
            orbitTime += 0.05; 
            
            const radius = 350; // Радиус увеличен с 260 до 350, чтобы летали подальше
            
            // Карточка 1
            const x1 = Math.cos(orbitTime) * radius;
            const y1 = Math.sin(orbitTime) * radius * 0.4;
            card1.style.transform = `translate(calc(-50% + ${x1}px), calc(-50% + ${y1}px)) rotateY(${orbitTime * 50}deg)`;
            card1.style.transition = 'none';

            // Карточка 2
            const x2 = Math.cos(orbitTime + Math.PI) * radius;
            const y2 = Math.sin(orbitTime + Math.PI) * radius * 0.4;
            card2.style.transform = `translate(calc(-50% + ${x2}px), calc(-50% + ${y2}px)) rotateY(${orbitTime * -50}deg)`;
            card2.style.transition = 'none';

            requestAnimationFrame(orbit);
        }

        setTimeout(() => {
            isOrbiting = true;
            orbit();
        }, 2500);

        // 4. Улет вниз
        setTimeout(() => {
            isOrbiting = false;
            
            card1.style.transition = 'transform 1s ease-in, opacity 1s ease-in';
            card2.style.transition = 'transform 1s ease-in, opacity 1s ease-in';
            
            card1.style.transform = 'translate(-50%, 150vh) scale(0.5)';
            card2.style.transform = 'translate(-50%, 150vh) scale(0.5)';
            card1.style.opacity = '0';
            card2.style.opacity = '0';
        }, 5000);

        // Скролл
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.2 });

        document.querySelectorAll('.static-card').forEach(card => observer.observe(card));
    </script>
</body>
</html>
