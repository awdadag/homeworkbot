<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | Маникюр</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fdf5f5; color: #333; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        /* Шапка */
        header { text-align: center; padding: 60px 20px; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); border-radius: 0 0 50px 50px; color: #fff; }
        header h1 { font-size: 36px; margin-bottom: 10px; text-shadow: 1px 1px 3px rgba(0,0,0,0.1); }
        header p { font-size: 18px; opacity: 0.9; }

        /* Услуги */
        .services { margin-top: 40px; }
        .services h2 { text-align: center; margin-bottom: 20px; color: #d66674; }
        .card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .card h3 { font-size: 18px; font-weight: 600; }
        .card span { font-weight: bold; color: #d66674; font-size: 18px; }

        /* Контакты */
        .contacts { margin-top: 40px; text-align: center; background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .contacts h2 { margin-bottom: 15px; color: #d66674; }
        .btn { display: inline-block; background: #d66674; color: #fff; padding: 12px 30px; border-radius: 25px; text-decoration: none; font-weight: bold; margin-top: 15px; transition: 0.3s; }
        .btn:hover { background: #b55460; transform: scale(1.05); }

        footer { text-align: center; margin-top: 40px; padding-bottom: 20px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

    <header>
        <h1>Nail Studio</h1>
        <p>Идеальный маникюр в твоем городе</p>
    </header>

    <div class="container">
        <section class="services">
            <h2>Наши услуги</h2>
            
            <div class="card">
                <h3>Маникюр с покрытием</h3>
                <span>2000 ₽</span>
            </div>
            
            <div class="card">
                <h3>Наращивание ногтей</h3>
                <span>3500 ₽</span>
            </div>
            
            <div class="card">
                <h3>Дизайн (за 1 ноготь)</h3>
                <span>150 ₽</span>
            </div>
        </section>

        <section class="contacts">
            <h2>Хотите записаться?</h2>
            <p>Работаем ежедневно с 10:00 до 20:00</p>
            <p>Телефон: +7 (999) 123-45-67</p>
            
            <!-- Кнопка для связи (можно вставить ссылку на твой Telegram-бот) -->
            <a href="https://t.me/твой_бот" class="btn" target="_blank">Записаться в Telegram</a>
        </section>
    </div>

    <footer>
        &copy; 2026 Nail Studio. Все права защищены.
    </footer>

</body>
</html>
