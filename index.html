<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | HyperSpace 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050510; 
            color: #fff; 
            font-family: 'Unbounded', sans-serif;
            overflow-x: hidden;
            perspective: 1000px;
            height: 300vh; /* Высокий сайт для скролла */
        }

        /* 3D Туннель на фоне */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        /* Экран 1: Главный */
        .section-1 {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }
        
        .section-1 h1 { 
            font-size: clamp(4rem, 12vw, 10rem); 
            line-height: 0.9;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
        }

        .section-1 p {
            font-size: 1.5rem;
            color: #888;
            margin-top: 20px;
            letter-spacing: 10px;
        }

        .btn {
            pointer-events: auto;
            margin-top: 50px;
            padding: 25px 80px;
            font-size: 1.5rem;
            font-family: 'Unbounded', sans-serif;
            font-weight: 900;
            color: #000;
            background: #fff;
            border-radius: 100px;
            text-decoration: none;
            transition: all 0.4s;
            box-shadow: 0 0 50px rgba(255,255,255,0.3);
        }
        
        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 100px rgba(255,255,255,0.8);
        }

        /* Экран 2: Карточки, которые летают */
        .section-2 {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            transform-style: preserve-3d;
        }

        .card {
            pointer-events: auto;
            width: 350px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            padding: 40px;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        .card h2 { font-size: 2rem; }
        .card .price { font-size: 4rem; font-weight: 900; color: #ff9a9e; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="content">
        <section class="section-1" id="sec1">
            <h1>NAIL<br>STUDIO</h1>
            <p>HYPERSPACE 3D</p>
            <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>
        </section>

        <section class="section-2" id="sec2">
            <div class="card" id="card1">
                <h2>Маникюр</h2>
                <div class="price">2 000</div>
            </div>
            <div class="card" id="card2">
                <h2>Наращивание</h2>
                <div class="price">3 500</div>
            </div>
        </section>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');

        // Сцена и камера
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.05); // Туман для глубины
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Летящие частицы (туннель)
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 3000;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            // Разбрасываем частицы по кругу
            posArray[i] = (Math.random() - 0.5) * 20;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.05,
            color: 0xffffff,
            transparent: true,
            opacity: 0.8
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // Анимация полета
        let scrollY = 0;
        let mouseX = 0;
        let mouseY = 0;

        window.addEventListener('scroll', () => {
            scrollY = window.scrollY;
        });

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate() {
            requestAnimationFrame(animate);
            
            // Камера летит вперед при скролле
            camera.position.z = 5 - scrollY * 0.01;
            camera.rotation.z += 0.002;
            
            // Реакция на мышку
            camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 2 - camera.position.y) * 0.05;

            // Частицы летят на камеру
            particlesMesh.rotation.y += 0.001;
            
            renderer.render(scene, camera);
        }
        animate();

        // 3D Эффект для карточек (наклон)
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            document.getElementById('card1').style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            document.getElementById('card2').style.transform = `rotateY(${-xAxis}deg) rotateX(${-yAxis}deg)`;
        });

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
