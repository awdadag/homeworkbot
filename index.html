<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | Space 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #030308; 
            color: #fff; 
            font-family: 'Unbounded', sans-serif;
            overflow-x: hidden;
        }

        /* 3D ФОН */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        /* ИНТРО */
        .intro {
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 10;
            perspective: 1500px;
        }

        /* ЗАГОЛОВОК */
        .title {
            font-size: clamp(4rem, 12vw, 10rem);
            line-height: 0.8;
            text-transform: uppercase;
            text-align: center;
            z-index: 10;
            opacity: 0;
            transform: scale(1.5);
            filter: blur(10px);
            text-shadow: 0 0 50px rgba(255,255,255,0.8);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.5); /* Центрируем */
        }

        /* КАРТОЧКИ */
        .card {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 280px;
            height: 380px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transform: translate(-50%, -50%) scale(0); /* Скрыты в начале */
            z-index: 5;
            transform-style: preserve-3d;
        }

        .card h2 { font-size: 1.5rem; }
        .card .price { font-size: 3.5rem; font-weight: 900; color: #fff; }

        /* НИЗ */
        .bottom-section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            position: relative;
            z-index: 20;
        }

        .static-card {
            width: 300px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0; 
            transform: translateY(150px);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }
        .static-card h2 { font-size: 2rem; }
        .static-card .price { font-size: 4rem; font-weight: 900; color: #fff; }

        .visible {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="intro">
        <div class="title">NAIL<br>STUDIO</div>
        <div class="card card-1">
            <h2>Маникюр</h2>
            <div class="price">2 000</div>
        </div>
        <div class="card card-2">
            <h2>Наращивание</h2>
            <div class="price">3 500</div>
        </div>
    </div>

    <div class="bottom-section">
        <div class="static-card" id="dest-1">
            <h2>Маникюр</h2>
            <div class="price">2 000</div>
        </div>
        <div class="static-card" id="dest-2">
            <h2>Наращивание</h2>
            <div class="price">3 500</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // === 3D КОСМОС ===
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030308, 0.03); 
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 5000;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 50;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.1, color: 0xffffff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending 
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);
        camera.position.z = 5;

        // === ДВИЖЕНИЕ МЫШИ (ВРАЩЕНИЕ) ===
        let mouseX = 0;
        let mouseY = 0;
        let canRotate = false; // Включается, когда карточки вылетели

        const card1 = document.querySelector('.card-1');
        const card2 = document.querySelector('.card-2');
        const title = document.querySelector('.title');

        document.addEventListener('mousemove', (e) => {
            // Для фона
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;

            // Для карточек (если они уже вылетели)
            if (canRotate) {
                const xAxis = (window.innerWidth / 2 - e.clientX) / 30;
                const yAxis = (window.innerHeight / 2 - e.clientY) / 30;

                // Левая карточка наклоняется
                card1.style.transform = `translate(-150%, -50%) perspective(1000px) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                // Правая карточка наклоняется в противоположную сторону
                card2.style.transform = `translate(50%, -50%) perspective(1000px) rotateY(${-xAxis}deg) rotateX(${-yAxis}deg)`;
                
                // Заголовок слегка парит
                title.style.transform = `translate(-50%, -50%) perspective(1000px) rotateY(${xAxis * 0.5}deg) rotateX(${yAxis * 0.5}deg)`;
            }
        });

        // Анимация фона
        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            particlesMesh.rotation.x += 0.0005;
            camera.position.x += (mouseX * 3 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 3 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }
        animate();

        // === АНИМАЦИЯ ПОЯВЛЕНИЯ ===
        window.addEventListener('load', () => {
            // 1. Заголовок
            setTimeout(() => {
                title.style.transition = 'all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                title.style.opacity = '1';
                title.style.filter = 'blur(0px)';
                title.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 100);

            // 2. Карточки
            setTimeout(() => {
                card1.style.transition = 'all 1.5s cubic-bezier(0.23, 1, 0.32, 1)';
                card2.style.transition = 'all 1.5s cubic-bezier(0.23, 1, 0.32, 1)';
                
                // Ставим их по бокам от центра
                card1.style.transform = 'translate(-150%, -50%)';
                card2.style.transform = 'translate(50%, -50%)';
                
                // Включаем 3D-вращение через 1.5 сек
                setTimeout(() => { canRotate = true; }, 1500);
            }, 500);

            // 3. Улет вниз
            setTimeout(() => {
                canRotate = false; // Отключаем вращение
                
                card1.style.transition = 'all 1s ease-in';
                card2.style.transition = 'all 1s ease-in';
                
                card1.style.transform = 'translate(-50%, 150vh) rotateY(360deg)';
                card2.style.transform = 'translate(-50%, 150vh) rotateY(-360deg)';
            }, 4500);
        });

        // 4. Появление при скролле
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.2 });

        document.querySelectorAll('.static-card').forEach(card => {
            observer.observe(card);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
