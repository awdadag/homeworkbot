<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | Cinematic Scroll</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050510; 
            color: #fff; 
            font-family: 'Unbounded', sans-serif;
            overflow-x: hidden;
        }

        /* Контейнер для 3D-сцены */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            perspective: 1500px;
            overflow: hidden;
        }

        /* Заголовок в центре */
        .center-block {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            opacity: 0;
        }

        .center-block h1 {
            font-size: clamp(4rem, 10vw, 8rem); 
            line-height: 0.9;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 50px rgba(255,255,255,0.8);
        }

        .phone {
            font-size: 1.2rem;
            margin-top: 20px;
            color: #aaa;
            letter-spacing: 2px;
        }

        /* Летающие карточки */
        .flying-card {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 250px;
            height: 350px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            backdrop-filter: blur(15px);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .flying-card h2 { font-size: 1.5rem; }
        .flying-card .price { font-size: 3rem; font-weight: 900; color: #ff9a9e; }

        /* Секция, которая открывается при скролле */
        .bottom-section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            padding: 100px 20px;
            background: #050510;
            position: relative;
            z-index: 20;
        }

        .static-card {
            width: 300px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            backdrop-filter: blur(15px);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            opacity: 0; /* Изначально скрыты, появятся при скролле */
        }
    </style>
</head>
<body>

    <!-- Первый экран с полетом -->
    <div class="scene">
        <div class="center-block">
            <h1>NAIL<br>STUDIO</h1>
            <div class="phone">+7 (999) 123-45-67</div>
        </div>

        <div class="flying-card card-1">
            <h2>Маникюр</h2>
            <div class="price">2 000</div>
        </div>
        
        <div class="flying-card card-2">
            <h2>Наращивание</h2>
            <div class="price">3 500</div>
        </div>
    </div>

    <!-- Второй экран (куда они прилетят) -->
    <div class="bottom-section">
        <div class="static-card" id="dest-card-1">
            <h2>Маникюр</h2>
            <div class="price">2 000</div>
        </div>
        <div class="static-card" id="dest-card-2">
            <h2>Наращивание</h2>
            <div class="price">3 500</div>
        </div>
    </div>

    <!-- Подключаем GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <script>
        gsap.registerPlugin(ScrollTrigger);

        // ==========================================
        // 1. КИНЕМАТОГРАФИЧНАЯ АНИМАЦИЯ ПОЯВЛЕНИЯ
        // ==========================================
        const tl = gsap.timeline();

        // Заголовок плавно появляется
        tl.to(".center-block", {
            opacity: 1,
            duration: 1.5,
            ease: "power2.out"
        })
        
        // Карточки вылетают с краев и кружатся
        .from(".card-1", {
            x: -800, y: -200, rotationZ: 45, opacity: 0, duration: 1.5, ease: "power3.out"
        }, 0.5)
        .from(".card-2", {
            x: 800, y: 200, rotationZ: -45, opacity: 0, duration: 1.5, ease: "power3.out"
        }, 0.5)

        // Карточки начинают вращаться вокруг заголовка (параллакс)
        .to(".card-1", {
            x: -250, y: -100, rotationY: 20, rotationX: 10, duration: 1.5, ease: "power2.inOut"
        }, 2)
        .to(".card-2", {
            x: 250, y: 100, rotationY: -20, rotationX: -10, duration: 1.5, ease: "power2.inOut"
        }, 2)

        // В конце анимации карточки улетают вниз за экран (чтобы мы их "нашли" при скролле)
        .to(".card-1", {
            y: "120vh", rotationZ: 90, opacity: 0, duration: 1, ease: "power2.in"
        }, 3.5)
        .to(".card-2", {
            y: "120vh", rotationZ: -90, opacity: 0, duration: 1, ease: "power2.in"
        }, 3.5)

        // ==========================================
        // 2. ПОЯВЛЕНИЕ КАРТОЧЕК ПРИ СКРОЛЛЕ (ScrollTrigger)
        // ==========================================
        gsap.from("#dest-card-1", {
            scrollTrigger: {
                trigger: ".bottom-section",
                start: "top bottom", // Начинается, как только секция показывается
                end: "center center",
                scrub: 1 // Плавная привязка к скроллу
            },
            y: -200,
            opacity: 0,
            rotationZ: -10
        });

        gsap.from("#dest-card-2", {
            scrollTrigger: {
                trigger: ".bottom-section",
                start: "top bottom",
                end: "center center",
                scrub: 1
            },
            y: -200,
            opacity: 0,
            rotationZ: 10
        });
    </script>
</body>
</html>
