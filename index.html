<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | Extreme 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050508; 
            color: #fff; 
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* Контейнер для 3D фона Vanta (Космос) */
        #vanta-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1; 
        }

        /* Шапка */
        header { 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        header h1 { 
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(5rem, 15vw, 12rem); 
            font-weight: 900; 
            line-height: 0.8;
            letter-spacing: -5px;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.8);
            text-shadow: 0 0 50px rgba(255, 255, 255, 0.2);
            opacity: 0;
            animation: slideUp 1.5s forwards 0.2s;
        }

        header h1 span {
            color: #fff;
            -webkit-text-stroke: 0;
        }

        .btn {
            margin-top: 40px;
            padding: 20px 60px;
            font-size: 1.2rem;
            font-weight: 800;
            font-family: 'Unbounded', sans-serif;
            color: #000;
            background: #fff;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.4s ease;
            opacity: 0;
            animation: slideUp 1s forwards 0.8s;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
        
        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 60px rgba(255,255,255,0.6);
        }

        /* Секция услуг (полет в 3D) */
        .services-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 5%;
            perspective: 2000px;
            position: relative;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 60px;
            width: 100%;
            max-width: 1400px;
        }

        /* Карточки, которые реально летают */
        .card {
            height: 500px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            transform-style: preserve-3d;
            transition: transform 0.4s ease-out, box-shadow 0.4s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Парящий эффект при наведении */
        .card:hover {
            transform: translateY(-30px) translateZ(50px);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 30px rgba(255,255,255,0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .card h3 {
            font-family: 'Unbounded', sans-serif;
            font-size: 2.5rem;
            transform: translateZ(80px);
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .card .price {
            font-family: 'Unbounded', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            color: #fff;
            transform: translateZ(60px);
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
            line-height: 1;
        }

        .card p {
            color: #aaa;
            font-size: 1.1rem;
            line-height: 1.6;
            transform: translateZ(40px);
        }

        /* Подвал */
        footer { 
            text-align: center; 
            padding: 50px 0; 
            color: #555;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-family: 'Unbounded', sans-serif;
            letter-spacing: 3px;
            font-size: 0.8rem;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(100px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 3D Космический фон -->
    <div id="vanta-bg"></div>

    <div class="content">
        <header>
            <h1>NAIL<br><span>STUDIO</span></h1>
            <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>
        </header>

        <section class="services-section">
            <div class="services-grid">
                <div class="card">
                    <h3>Маникюр</h3>
                    <div class="price">2 000</div>
                    <p>Аппаратный и комбинированный маникюр с премиальным покрытием.</p>
                </div>
                <div class="card">
                    <h3>Наращивание</h3>
                    <div class="price">3 500</div>
                    <p>Моделирование любой формы и длины. Идеальная архитектура.</p>
                </div>
                <div class="card">
                    <h3>Дизайн</h3>
                    <div class="price">150</div>
                    <p>Сложная роспись, инкрустация камнями и модные эффекты.</p>
                </div>
            </div>
        </section>

        <footer>
            <p>+7 (999) 123-45-67</p>
            <p style="margin-top: 15px;">МОСКВА | 2026</p>
        </footer>
    </div>

    <!-- Скрипты для 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
    
    <script>
        // ОГРОМНЫЙ 3D ГЛОБУС НА ФОНЕ (Вместо сетки)
        VANTA.GLOBE({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0xffffff,
            color2: 0xff9a9e,
            size: 2.00,
            backgroundColor: 0x050508
        });

        // 3D ЭФФЕКТ ДЛЯ КАРТОЧЕК (Слежение за мышкой)
        const cards = document.querySelectorAll('.card');

        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -15;
                const rotateY = ((x - centerX) / centerX) * 15;
                
                card.style.transform = `perspective(1500px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = `perspective(1500px) rotateX(0) rotateY(0) scale3d(1, 1, 1)`;
                card.style.transition = 'transform 0.6s ease';
            });

            card.addEventListener('mouseenter', () => {
                card.style.transition = 'none';
            });
        });
    </script>
</body>
</html>
