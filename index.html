<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Studio | Cinematic 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #030305; 
            color: #fff; 
            font-family: 'Unbounded', sans-serif;
            overflow: hidden; /* Скрываем скролл для кинематографичности */
        }

        /* Канвас для 3D фона */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        /* Контейнер для контента */
        .content {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        /* Заголовок, который собирается из частиц */
        .title-container {
            text-align: center;
            perspective: 1000px;
        }

        .title {
            font-size: clamp(5rem, 15vw, 12rem); 
            font-weight: 900;
            line-height: 0.8;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 40px rgba(255, 154, 158, 0.6), 0 0 80px rgba(255, 154, 158, 0.3);
            opacity: 0;
            transform: scale(5) translateZ(500px);
            filter: blur(20px);
        }

        .subtitle {
            font-size: 1.5rem;
            color: #888;
            letter-spacing: 15px;
            margin-top: 30px;
            opacity: 0;
            transform: translateY(30px);
        }

        .btn {
            pointer-events: auto;
            margin-top: 60px;
            padding: 25px 80px;
            font-size: 1.5rem;
            font-weight: 900;
            color: #000;
            background: #fff;
            border-radius: 100px;
            text-decoration: none;
            opacity: 0;
            transform: translateY(50px);
            box-shadow: 0 0 50px rgba(255,255,255,0.4);
            transition: all 0.4s ease;
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 80px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="content">
        <div class="title-container">
            <h1 class="title">NAIL<br>STUDIO</h1>
            <p class="subtitle">CINEMATIC 3D</p>
            <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>
        </div>
    </div>

    <!-- Three.js для 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GSAP для анимаций -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script>
        // === 3D СЦЕНА (Летающие карточки в начале) ===
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Создаем группу для карточек-частиц
        const cardGroup = new THREE.Group();
        
        // Генерируем 100 светящихся карточек
        const cardGeometry = new THREE.PlaneGeometry(2, 3);
        const cardMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xffffff, 
            transparent: true, 
            opacity: 0.15, 
            side: THREE.DoubleSide,
            wireframe: true 
        });

        for(let i = 0; i < 100; i++) {
            const card = new THREE.Mesh(cardGeometry, cardMaterial);
            // Разбрасываем в 3D-сфере
            const radius = 10 + Math.random() * 20;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            
            card.position.x = radius * Math.sin(phi) * Math.cos(theta);
            card.position.y = radius * Math.sin(phi) * Math.sin(theta);
            card.position.z = radius * Math.cos(phi);
            
            // Случайные повороты
            card.rotation.x = Math.random() * Math.PI;
            card.rotation.y = Math.random() * Math.PI;
            
            cardGroup.add(card);
        }
        scene.add(cardGroup);

        camera.position.z = 20;

        // Анимация вращения фона
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate() {
            requestAnimationFrame(animate);
            
            // Вращаем карточки
            cardGroup.rotation.y += 0.002;
            cardGroup.rotation.x += 0.001;

            // Реакция на мышку
            camera.position.x += (mouseX * 5 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 5 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        // === КИНЕМАТОГРАФИЧНАЯ АНИМАЦИЯ ТЕКСТА ===
        const tl = gsap.timeline();

        // 1. Через 0.5 сек карточки разлетаются (камера отдаляется)
        tl.to(camera.position, {
            z: 60,
            duration: 2,
            ease: "power2.inOut"
        }, 0.5)
        
        // 2. Заголовок вылетает из глубины с размытием
        .to(".title", {
            opacity: 1,
            scale: 1,
            z: 0,
            filter: "blur(0px)",
            duration: 1.5,
            ease: "power4.out"
        }, 1)
        
        // 3. Подзаголовок выезжает снизу
        .to(".subtitle", {
            opacity: 1,
            y: 0,
            duration: 1,
            ease: "power3.out"
        }, 1.5)
        
        // 4. Кнопка выпрыгивает
        .to(".btn", {
            opacity: 1,
            y: 0,
            duration: 1,
            ease: "back.out(1.7)"
        }, 1.8);

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
