<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Assembly</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050510; 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        .section {
            height: 150vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .section h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(3rem, 10vw, 8rem);
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, #ff00cc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section p {
            font-size: 1.5rem;
            color: #ff00cc;
            letter-spacing: 5px;
            margin-top: 20px;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s;
        }

        .btn {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 60px;
            font-family: 'Unbounded', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(90deg, #ff00cc, #3333ff);
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 40px rgba(255, 0, 204, 0.6);
            z-index: 10;
            pointer-events: auto;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 0 80px rgba(255, 0, 204, 1);
        }
    </style>
</head>
<body>

    <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>

    <div id="canvas-container"></div>

    <div class="content">
        <section class="section">
            <h1>CAR</h1>
            <p id="text-1">Разборка</p>
        </section>

        <section class="section">
            <h1>DETAILS</h1>
            <p id="text-2">Каждая деталь важна</p>
        </section>

        <section class="section">
            <h1>ASSEMBLY</h1>
            <p id="text-3">Сборка</p>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xff00cc, 3);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const dirLight2 = new THREE.DirectionalLight(0x3333ff, 3);
        dirLight2.position.set(-5, -5, 5);
        scene.add(dirLight2);

        // --- ГЕНЕРАЦИЯ "МАШИНЫ" ИЗ БЛОКОВ ---
        const carGroup = new THREE.Group();
        const parts = [];

        // Функция для создания блока (кубика)
        function createBlock(x, y, z, w, h, d, color) {
            const geom = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ 
                color: color,
                roughness: 0.1,
                metalness: 0.9,
                emissive: 0x220033 // Легкое свечение
            });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(x, y, z);
            
            // Сохраняем изначальную позицию для сборки
            mesh.userData.originalPos = new THREE.Vector3(x, y, z);
            mesh.userData.explodeDir = new THREE.Vector3(
                (Math.random() - 0.5) * 15,
                (Math.random() - 0.5) * 15,
                (Math.random() - 0.5) * 15
            );

            carGroup.add(mesh);
            parts.push(mesh);
        }

        // Собираем силуэт спорткара из блоков
        // Кузов
        createBlock(0, 0.5, 0, 4, 0.6, 2, 0xff00cc); 
        // Капот
        createBlock(1.5, 0.3, 0, 1.5, 0.4, 1.8, 0x3333ff);
        // Крыша
        createBlock(-0.5, 1.0, 0, 2, 0.6, 1.6, 0x111111);
        // Заднее крыло
        createBlock(-2, 0.6, 0, 0.8, 0.8, 2, 0xff00cc);
        // Колеса (слева)
        createBlock(1.2, -0.2, 1.1, 1, 1, 0.3, 0x000000);
        createBlock(-1.2, -0.2, 1.1, 1, 1, 0.3, 0x000000);
        // Колеса (справа)
        createBlock(1.2, -0.2, -1.1, 1, 1, 0.3, 0x000000);
        createBlock(-1.2, -0.2, -1.1, 1, 1, 0.3, 0x000000);

        scene.add(carGroup);

        // Вращение в простое
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (window.scrollY < 100) {
                carGroup.rotation.y = elapsedTime * 0.5;
            }

            renderer.render(scene, camera);
        }
        animate();

        // --- АНИМАЦИЯ РАЗБОРКИ ---
        // 1. Разлетаем детали
        gsap.to(parts.map(p => p.position), {
            scrollTrigger: {
                trigger: ".section:nth-child(1)",
                start: "top top",
                end: "bottom top",
                scrub: 1
            },
            x: (i) => parts[i].userData.explodeDir.x,
            y: (i) => parts[i].userData.explodeDir.y,
            z: (i) => parts[i].userData.explodeDir.z,
            rotationX: () => Math.random() * Math.PI * 2,
            rotationY: () => Math.random() * Math.PI * 2,
            ease: "power2.inOut"
        });

        // Вращение машины при разборке
        gsap.to(carGroup.rotation, {
            scrollTrigger: {
                trigger: ".section:nth-child(1)",
                start: "top top",
                end: "bottom top",
                scrub: 1
            },
            y: Math.PI * 2,
            ease: "power2.inOut"
        });

        // Появление текста 1
        gsap.to("#text-1", {
            scrollTrigger: {
                trigger: ".section:nth-child(1)",
                start: "top center",
                end: "bottom center",
                scrub: true
            },
            opacity: 1,
            y: 0
        });

        // 2. Собираем детали обратно
        gsap.to(parts.map(p => p.position), {
            scrollTrigger: {
                trigger: ".section:nth-child(2)",
                start: "top center",
                end: "bottom top",
                scrub: 1
            },
            x: (i) => parts[i].userData.originalPos.x,
            y: (i) => parts[i].userData.originalPos.y,
            z: (i) => parts[i].userData.originalPos.z,
            rotationX: 0,
            rotationY: 0,
            ease: "power2.inOut"
        });

        // Появление текста 2
        gsap.to("#text-2", {
            scrollTrigger: {
                trigger: ".section:nth-child(2)",
                start: "top center",
                end: "bottom center",
                scrub: true
            },
            opacity: 1,
            y: 0
        });

        // Текст 3
        gsap.to("#text-3", {
            scrollTrigger: {
                trigger: ".section:nth-child(3)",
                start: "top center",
                end: "bottom center",
                scrub: true
            },
            opacity: 1,
            y: 0
        });

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
