<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON 3D | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: radial-gradient(circle at center, #1a0022 0%, #000000 100%);
            color: #fff; 
            font-family: 'Unbounded', sans-serif;
            overflow: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 0;
            width: 100%;
            pointer-events: none;
        }

        .ui-overlay h1 {
            font-size: clamp(4rem, 15vw, 15rem);
            line-height: 0.8;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 0, 204, 0.2);
            opacity: 0.3;
            user-select: none;
        }

        .ui-overlay .btn {
            position: absolute;
            bottom: -150px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 60px;
            font-size: 1.2rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(90deg, #ff00cc, #3333ff);
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 40px rgba(255, 0, 204, 0.6);
            z-index: 10;
            pointer-events: auto;
            transition: 0.3s;
        }

        .ui-overlay .btn:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 0 80px rgba(255, 0, 204, 1);
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <h1>NEON</h1>
        <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>
    </div>

    <div id="canvas-container"></div>

    <!-- Скрипты -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xff00cc, 3); 
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const dirLight2 = new THREE.DirectionalLight(0x3333ff, 3); 
        dirLight2.position.set(-5, 5, -5);
        scene.add(dirLight2);

        // Модель банки (загружается напрямую из интернета)
        const loader = new THREE.GLTFLoader();
        let model;

        // Ссылка на бесплатную 3D-модель банки (надежный CDN)
        const modelUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/can.glb';

        loader.load(modelUrl, function (gltf) {
            model = gltf.scene;
            model.scale.set(1.5, 1.5, 1.5); 
            scene.add(model);
        }, undefined, function (error) {
            console.error('Ошибка загрузки модели:', error);
        });

        // Мышка
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (model) {
                model.rotation.y = elapsedTime * 0.5; // Вращение
                model.position.y = Math.sin(elapsedTime * 2) * 0.2; // Левитация

                // Наклон за мышкой
                model.rotation.x += (mouseY * 0.5 - model.rotation.x) * 0.1;
                model.rotation.z += (mouseX * 0.5 - model.rotation.z) * 0.1;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
