<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON 3D | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            /* Возвращаем темный фон */
            background: #05000a;
            background: radial-gradient(circle at center, #1a0022 0%, #05000a 100%);
            color: #fff; 
            font-family: 'Unbounded', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 0;
            width: 100%;
            pointer-events: none;
        }

        .ui-overlay h1 {
            font-size: clamp(4rem, 15vw, 15rem);
            line-height: 0.8;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 0, 204, 0.2);
            opacity: 0.3;
            user-select: none;
        }

        .ui-overlay .btn {
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 60px;
            font-size: 1.2rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(90deg, #ff00cc, #3333ff);
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 40px rgba(255, 0, 204, 0.6);
            z-index: 10;
            pointer-events: auto;
            transition: 0.3s;
        }

        .ui-overlay .btn:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 0 80px rgba(255, 0, 204, 1);
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <h1>NEON</h1>
        <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // --- СОЗДАЕМ 3D ОБЪЕКТ ИЗ КОДА ---
        // Это будет светящийся кристалл (икосаэдр)
        const geometry = new THREE.IcosahedronGeometry(2, 0); // Размер 2, граней 0
        
        // Материал с неоновой подсветкой
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xff00cc, 
            emissive: 0x3300aa, // Цвет свечения
            roughness: 0.2,
            metalness: 0.8,
            wireframe: false
        });
        
        const shape = new THREE.Mesh(geometry, material);
        scene.add(shape);

        // Добавим неоновую обводку (Wireframe)
        const wireframe = new THREE.WireframeGeometry(geometry);
        const line = new THREE.LineSegments(wireframe);
        line.material.color.set(0xffffff); // Белая обводка
        line.material.opacity = 0.2;
        line.material.transparent = true;
        line.scale.set(1.01, 1.01, 1.01); // Чуть больше основной фигуры
        shape.add(line);

        // --- СВЕТ ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Розовый свет
        const dirLight1 = new THREE.PointLight(0xff00cc, 5, 20);
        dirLight1.position.set(5, 5, 5);
        scene.add(dirLight1);

        // Синий свет
        const dirLight2 = new THREE.PointLight(0x3333ff, 5, 20);
        dirLight2.position.set(-5, -5, 5);
        scene.add(dirLight2);

        // --- АНИМАЦИЯ ---
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();

            // Вращение
            shape.rotation.y = elapsedTime * 0.3;
            shape.rotation.x = elapsedTime * 0.2;

            // Левитация (вверх-вниз)
            shape.position.y = Math.sin(elapsedTime * 1.5) * 0.3;

            // Реакция на мышку (наклон)
            shape.rotation.z += (mouseX * 0.5 - shape.rotation.z) * 0.1;

            // Меняем свет, чтобы он пульсировал
            dirLight1.intensity = 3 + Math.sin(elapsedTime * 3) * 2;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
