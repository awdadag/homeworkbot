<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Sports Car Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050510; 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            /* Отключаем стандартный скролл */
            overflow: hidden; 
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Контейнер для слайдов */
        .presentation-container {
            position: relative;
            z-index: 2;
            height: 100vh;
            width: 100vw;
            pointer-events: none; /* Пропускаем клики к 3D */
        }

        /* Каждый слайд на весь экран */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            opacity: 0; /* Скрыты по умолчанию */
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .slide.active {
            opacity: 1; /* Показываем только активный слайд */
            pointer-events: auto;
        }

        .slide h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(3rem, 10vw, 8rem);
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, #ff00cc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .slide p {
            font-size: 1.5rem;
            color: #ff00cc;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Кнопка */
        .btn {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 60px;
            font-family: 'Unbounded', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(90deg, #ff00cc, #3333ff);
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 40px rgba(255, 0, 204, 0.6);
            z-index: 10;
            pointer-events: auto;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 0 80px rgba(255, 0, 204, 1);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="presentation-container">
        <!-- Слайд 1 -->
        <section class="slide active" id="slide-1">
            <h1>SPORTS CAR</h1>
            <p>Premium Experience</p>
        </section>

        <!-- Слайд 2 -->
        <section class="slide" id="slide-2">
            <h1>РАЗБОРКА</h1>
            <p>Каждая деталь важна</p>
        </section>

        <!-- Слайд 3 -->
        <section class="slide" id="slide-3">
            <h1>СБОРКА</h1>
            <p>Идеальная архитектура</p>
        </section>
    </div>

    <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 3, 7); 
        camera.lookAt(0, 0.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xff00cc, 4);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const dirLight2 = new THREE.DirectionalLight(0x3333ff, 4);
        dirLight2.position.set(-5, 5, 5);
        scene.add(dirLight2);

        // --- СОЗДАЕМ КРАСНЫЙ СПОРТКАР ---
        const carGroup = new THREE.Group();
        const parts = [];

        function createPart(geometry, color, x, y, z, rx = 0, ry = 0, rz = 0) {
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.1,
                metalness: 0.9, 
            });
            const mesh = new THREE.Mesh(geometry, mat);
            mesh.position.set(x, y, z);
            mesh.rotation.set(rx, ry, rz);
            mesh.userData.originalPos = new THREE.Vector3(x, y, z);
            
            carGroup.add(mesh);
            parts.push(mesh);
            return mesh;
        }

        // Красный корпус
        createPart(new THREE.BoxGeometry(4.5, 0.5, 2.2), 0xff0000, 0, 0.5, 0);
        
        // Красная кабина (скошенная)
        const cabinGeom = new THREE.BoxGeometry(2.2, 0.6, 1.8);
        const posAttribute = cabinGeom.attributes.position;
        for (let i = 0; i < posAttribute.count; i++) {
            if (posAttribute.getY(i) > 0) {
                posAttribute.setX(i, posAttribute.getX(i) * 0.6);
                posAttribute.setZ(i, posAttribute.getZ(i) * 0.7);
            }
        }
        cabinGeom.computeVertexNormals();
        createPart(cabinGeom, 0xff0000, -0.5, 1.05, 0);

        // Капот (темно-серый)
        createPart(new THREE.BoxGeometry(1.8, 0.15, 2.0), 0x333333, 1.8, 0.85, 0, 0, 0, -0.1);

        // Колеса (черные с серебристыми дисками)
        const wheelGeom = new THREE.CylinderGeometry(0.6, 0.6, 0.3, 32);
        const discGeom = new THREE.CylinderGeometry(0.4, 0.4, 0.32, 32);

        // Левое переднее
        createPart(wheelGeom, 0x000000, 1.3, 0, 1.2, Math.PI/2, 0, 0);
        createPart(discGeom, 0xaaaaaa, 1.3, 0, 1.2, Math.PI/2, 0, 0);
        // Правое переднее
        createPart(wheelGeom, 0x000000, 1.3, 0, -1.2, Math.PI/2, 0, 0);
        createPart(discGeom, 0xaaaaaa, 1.3, 0, -1.2, Math.PI/2, 0, 0);
        // Левое заднее
        createPart(wheelGeom, 0x000000, -1.3, 0, 1.2, Math.PI/2, 0, 0);
        createPart(discGeom, 0xaaaaaa, -1.3, 0, 1.2, Math.PI/2, 0, 0);
        // Правое заднее
        createPart(wheelGeom, 0x000000, -1.3, 0, -1.2, Math.PI/2, 0, 0);
        createPart(discGeom, 0xaaaaaa, -1.3, 0, -1.2, Math.PI/2, 0, 0);

        carGroup.position.y = -0.5; 
        scene.add(carGroup);

        // Анимация рендера
        const clock = new THREE.Clock();
        let currentSlide = 0;

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Вращение на первом слайде
            if (currentSlide === 0) {
                carGroup.rotation.y = elapsedTime * 0.3;
            }

            renderer.render(scene, camera);
        }
        animate();

        // --- ЛОГИКА СЛАЙДОВ (КАК В ПРЕЗЕНТАЦИИ) ---
        const slides = [document.getElementById('slide-1'), document.getElementById('slide-2'), document.getElementById('slide-3')];
        let isAnimating = false;

        // Функция разборки машины
        function explodeCar() {
            gsap.to(parts.map(p => p.position), {
                x: (i) => parts[i].position.x * 2.5 + (Math.random() - 0.5) * 2,
                y: (i) => parts[i].position.y * 2.5 + (Math.random() - 0.5) * 2,
                z: (i) => parts[i].position.z * 2.5 + (Math.random() - 0.5) * 2,
                rotationX: () => Math.random() * Math.PI,
                rotationY: () => Math.random() * Math.PI,
                duration: 1.5,
                ease: "power2.inOut"
            });
        }

        // Функция сборки машины
        function assembleCar() {
            gsap.to(parts.map(p => p.position), {
                x: (i) => parts[i].userData.originalPos.x,
                y: (i) => parts[i].userData.originalPos.y,
                z: (i) => parts[i].userData.originalPos.z,
                rotationX: 0,
                rotationY: 0,
                duration: 1.5,
                ease: "power2.inOut"
            });
        }

        // Обработка скролла колесиком мыши
        window.addEventListener('wheel', (e) => {
            if (isAnimating) return; // Блокируем, пока идет анимация

            if (e.deltaY > 0) {
                // Скролл вниз
                if (currentSlide < slides.length - 1) {
                    currentSlide++;
                    updateSlides();
                }
            } else {
                // Скролл вверх
                if (currentSlide > 0) {
                    currentSlide--;
                    updateSlides();
                }
            }
        });

        // Обработка свайпов на телефоне
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', (e) => {
            if (isAnimating) return;
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;

            if (diff > 50) { // Свайп вверх
                if (currentSlide < slides.length - 1) {
                    currentSlide++;
                    updateSlides();
                }
            } else if (diff < -50) { // Свайп вниз
                if (currentSlide > 0) {
                    currentSlide--;
                    updateSlides();
                }
            }
        });

        // Обновление слайдов
        function updateSlides() {
            isAnimating = true;

            // Скрываем все слайды
            slides.forEach(s => s.classList.remove('active'));
            
            // Показываем текущий
            slides[currentSlide].classList.add('active');

            // Логика анимации машины
            if (currentSlide === 0) {
                assembleCar(); // Собираем при возврате на 1 слайд
                gsap.to(carGroup.rotation, { y: 0, duration: 1 }); // Сбрасываем вращение
            } else if (currentSlide === 1) {
                explodeCar(); // Разбираем на 2 слайде
            } else if (currentSlide === 2) {
                assembleCar(); // Собираем на 3 слайде
            }

            // Разблокируем скролл через 1.5 секунды (пока идет анимация)
            setTimeout(() => {
                isAnimating = false;
            }, 1500);
        }

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
