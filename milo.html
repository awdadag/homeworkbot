<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Sports Car Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050510; 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            /* Включаем нормальный скролл */
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        /* Слайды: каждый по 100vh */
        .slide {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .slide h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(3rem, 10vw, 8rem);
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, #ff00cc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .slide p {
            font-size: 1.5rem;
            color: #ff00cc;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .btn {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 60px;
            font-family: 'Unbounded', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(90deg, #ff00cc, #3333ff);
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 40px rgba(255, 0, 204, 0.6);
            z-index: 10;
            pointer-events: auto;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 0 80px rgba(255, 0, 204, 1);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="content">
        <section class="slide" id="slide-1">
            <h1>SPORTS CAR</h1>
            <p>Premium Experience</p>
        </section>

        <section class="slide" id="slide-2">
            <h1>РАЗБОРКА</h1>
            <p>Каждая деталь важна</p>
        </section>

        <section class="slide" id="slide-3">
            <h1>СБОРКА</h1>
            <p>Идеальная архитектура</p>
        </section>
    </div>

    <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 2.5, 8); 
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xff00cc, 3);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const dirLight2 = new THREE.DirectionalLight(0x3333ff, 3);
        dirLight2.position.set(-5, 5, 5);
        scene.add(dirLight2);

        // --- СОЗДАЕМ СПОРТКАР (НИЗКИЙ И ШИРОКИЙ) ---
        const carGroup = new THREE.Group();
        const parts = [];

        function createPart(geometry, color, x, y, z, rx = 0, ry = 0, rz = 0) {
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.1,
                metalness: 0.9, 
            });
            const mesh = new THREE.Mesh(geometry, mat);
            mesh.position.set(x, y, z);
            mesh.rotation.set(rx, ry, rz);
            mesh.userData.originalPos = new THREE.Vector3(x, y, z);
            
            carGroup.add(mesh);
            parts.push(mesh);
            return mesh;
        }

        // Низкий и широкий корпус (как у спорткара)
        createPart(new THREE.BoxGeometry(5, 0.4, 2.4), 0xff0000, 0, 0.4, 0);
        
        // Покатая крыша (скошенная)
        const cabinGeom = new THREE.BoxGeometry(2.5, 0.5, 2.0);
        const posAttribute = cabinGeom.attributes.position;
        for (let i = 0; i < posAttribute.count; i++) {
            if (posAttribute.getY(i) > 0) {
                posAttribute.setX(i, posAttribute.getX(i) * 0.5);
                posAttribute.setZ(i, posAttribute.getZ(i) * 0.6);
            }
        }
        cabinGeom.computeVertexNormals();
        createPart(cabinGeom, 0x111111, -0.8, 0.85, 0);

        // Длинный капот
        createPart(new THREE.BoxGeometry(2.5, 0.15, 2.2), 0x333333, 2, 0.75, 0, 0, 0, -0.05);

        // Колеса (большие, чтобы было похоже на спорткар)
        const wheelGeom = new THREE.CylinderGeometry(0.7, 0.7, 0.4, 32);
        const discGeom = new THREE.CylinderGeometry(0.5, 0.5, 0.42, 32);

        // Передние
        createPart(wheelGeom, 0x000000, 1.6, 0, 1.3, Math.PI/2, 0, 0);
        createPart(discGeom, 0xaaaaaa, 1.6, 0, 1.3, Math.PI/2, 0, 0);
        createPart(wheelGeom, 0x000000, 1.6, 0, -1.3, Math.PI/2, 0, 0);
        createPart(discGeom, 0xaaaaaa, 1.6, 0, -1.3, Math.PI/2, 0, 0);
        
        // Задние
        createPart(wheelGeom, 0x000000, -1.6, 0, 1.3, Math.PI/2, 0, 0);
        createPart(discGeom, 0xaaaaaa, -1.6, 0, 1.3, Math.PI/2, 0, 0);
        createPart(wheelGeom, 0x000000, -1.6, 0, -1.3, Math.PI/2, 0, 0);
        createPart(discGeom, 0xaaaaaa, -1.6, 0, -1.3, Math.PI/2, 0, 0);

        carGroup.position.y = -0.3; 
        scene.add(carGroup);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (window.scrollY < 100) {
                carGroup.rotation.y = elapsedTime * 0.3;
            }

            renderer.render(scene, camera);
        }
        animate();

        // --- ЛОГИКА ПЕРЕКЛЮЧЕНИЯ СЛАЙДОВ ПРИ СКРОЛЛЕ ---
        
        // 1. Первый слайд: машина крутится
        gsap.to(carGroup.rotation, {
            scrollTrigger: {
                trigger: ".slide:nth-child(1)",
                start: "top top",
                end: "bottom top",
                scrub: 1
            },
            y: Math.PI * 2
        });

        // 2. Второй слайд: разборка
        gsap.to(parts.map(p => p.position), {
            scrollTrigger: {
                trigger: ".slide:nth-child(2)",
                start: "top bottom", // Начинаем, когда второй слайд появляется
                end: "bottom top",
                scrub: 1
            },
            x: (i) => parts[i].position.x * 2.5 + (Math.random() - 0.5) * 2,
            y: (i) => parts[i].position.y * 2.5 + (Math.random() - 0.5) * 2,
            z: (i) => parts[i].position.z * 2.5 + (Math.random() - 0.5) * 2,
            rotationX: () => Math.random() * Math.PI,
            rotationY: () => Math.random() * Math.PI,
            ease: "power2.inOut"
        });

        // 3. Третий слайд: сборка
        gsap.to(parts.map(p => p.position), {
            scrollTrigger: {
                trigger: ".slide:nth-child(3)",
                start: "top bottom",
                end: "bottom top",
                scrub: 1
            },
            x: (i) => parts[i].userData.originalPos.x,
            y: (i) => parts[i].userData.originalPos.y,
            z: (i) => parts[i].userData.originalPos.z,
            rotationX: 0,
            rotationY: 0,
            ease: "power2.inOut"
        });

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
