<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Scroll</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050510; 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        .section {
            height: 200vh; /* Высокие секции для плавного скролла */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .section h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(3rem, 10vw, 8rem);
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, #ff00cc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section p {
            font-size: 1.5rem;
            color: #ff00cc;
            letter-spacing: 5px;
            margin-top: 20px;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0;
            transform: translateY(30px);
        }

        .btn {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 60px;
            font-family: 'Unbounded', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(90deg, #ff00cc, #3333ff);
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 40px rgba(255, 0, 204, 0.6);
            z-index: 10;
            pointer-events: auto;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 0 80px rgba(255, 0, 204, 1);
        }
    </style>
</head>
<body>

    <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>

    <div id="canvas-container"></div>

    <div class="content">
        <section class="section">
            <h1>CAR</h1>
            <p id="text-1">Разборка</p>
        </section>

        <section class="section">
            <h1>DETAILS</h1>
            <p id="text-2">Каждая деталь</p>
        </section>

        <section class="section">
            <h1>ASSEMBLY</h1>
            <p id="text-3">Сборка</p>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 4, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xff00cc, 2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const dirLight2 = new THREE.DirectionalLight(0x3333ff, 2);
        dirLight2.position.set(-5, -5, 5);
        scene.add(dirLight2);

        let carModel = null;
        const partData = [];

        const loader = new THREE.GLTFLoader();
        
        // Ссылка на модель машины (из открытого репозитория Three.js)
        const modelUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/ferrari.glb';

        loader.load(modelUrl, function (gltf) {
            carModel = gltf.scene;
            
            // Центрируем
            const box = new THREE.Box3().setFromObject(carModel);
            const center = new THREE.Vector3();
            box.getCenter(center);
            carModel.position.sub(center);
            
            scene.add(carModel);

            // Ищем все детали (колеса, кузов и т.д.)
            carModel.traverse((child) => {
                if (child.isMesh) {
                    partData.push({
                        mesh: child,
                        originalPos: child.position.clone()
                    });
                }
            });

            console.log('Найдено деталей:', partData.length);
            
            // Если деталей мало (модель цельная), мы немного раздвинем её части
            if (partData.length < 5) {
                // Искусственно раздвигаем, чтобы было похоже на разборку
                partData.forEach((data, index) => {
                    data.explodeDir = new THREE.Vector3(
                        (Math.random() - 0.5) * 3,
                        (Math.random() - 0.5) * 3,
                        (Math.random() - 0.5) * 3
                    );
                });
            }

            // Запускаем анимацию скролла
            initScroll();

        }, undefined, function (error) {
            console.error('Ошибка загрузки модели:', error);
            // Если модель не загрузилась, покажем текст ошибки на экране
            document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20vh;'>Ошибка загрузки 3D-модели</h1>";
        });

        // Вращение в простое
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (carModel && window.scrollY < 100) {
                carModel.rotation.y = elapsedTime * 0.3;
            }

            renderer.render(scene, camera);
        }
        animate();

        // --- АНИМАЦИЯ СКРОЛЛА (ТУДА-ОБРАТНО) ---
        function initScroll() {
            
            // 1. Когда листаем ВНИЗ - машина разбирается
            gsap.to(partData.map(p => p.mesh.position), {
                scrollTrigger: {
                    trigger: ".section:nth-child(1)",
                    start: "top top",
                    end: "bottom top",
                    scrub: 1 // Это ключевой параметр! Он привязывает анимацию к скроллу
                },
                x: (i) => partData[i].explodeDir ? partData[i].explodeDir.x : (partData[i].originalPos.x * 2),
                y: (i) => partData[i].explodeDir ? partData[i].explodeDir.y : (partData[i].originalPos.y * 2),
                z: (i) => partData[i].explodeDir ? partData[i].explodeDir.z : (partData[i].originalPos.z * 2),
                rotationX: () => Math.random() * Math.PI * 2,
                rotationY: () => Math.random() * Math.PI * 2,
                ease: "power2.inOut"
            });

            // Вращение машины при разборке
            gsap.to(carModel.rotation, {
                scrollTrigger: {
                    trigger: ".section:nth-child(1)",
                    start: "top top",
                    end: "bottom top",
                    scrub: 1
                },
                y: Math.PI * 2,
                ease: "power2.inOut"
            });

            // Текст 1
            gsap.to("#text-1", {
                scrollTrigger: {
                    trigger: ".section:nth-child(1)",
                    start: "top center",
                    end: "bottom center",
                    scrub: true
                },
                opacity: 1,
                y: 0
            });

            // 2. Когда листаем ЕЩЕ НИЖЕ - детали собираются обратно
            gsap.to(partData.map(p => p.mesh.position), {
                scrollTrigger: {
                    trigger: ".section:nth-child(2)",
                    start: "top center",
                    end: "bottom top",
                    scrub: 1
                },
                x: (i) => partData[i].originalPos.x,
                y: (i) => partData[i].originalPos.y,
                z: (i) => partData[i].originalPos.z,
                rotationX: 0,
                rotationY: 0,
                ease: "power2.inOut"
            });

            // Текст 2
            gsap.to("#text-2", {
                scrollTrigger: {
                    trigger: ".section:nth-child(2)",
                    start: "top center",
                    end: "bottom center",
                    scrub: true
                },
                opacity: 1,
                y: 0
            });

            // Текст 3
            gsap.to("#text-3", {
                scrollTrigger: {
                    trigger: ".section:nth-child(3)",
                    start: "top center",
                    end: "bottom center",
                    scrub: true
                },
                opacity: 1,
                y: 0
            });
        }

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
