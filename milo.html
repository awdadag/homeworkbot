<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050510; 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        /* Каждый слайд = ровно 100vh */
        .slide {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .slide h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(3rem, 10vw, 8rem);
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, #ff00cc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .slide p {
            font-size: 1.5rem;
            color: #ff00cc;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .btn {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 60px;
            font-family: 'Unbounded', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(90deg, #ff00cc, #3333ff);
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 40px rgba(255, 0, 204, 0.6);
            z-index: 10;
            pointer-events: auto;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 0 80px rgba(255, 0, 204, 1);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="content">
        <section class="slide" id="slide-1">
            <h1>SPORTS CAR</h1>
            <p>Premium Experience</p>
        </section>

        <section class="slide" id="slide-2">
            <h1>РАЗБОРКА</h1>
            <p>Каждая деталь важна</p>
        </section>

        <section class="slide" id="slide-3">
            <h1>СБОРКА</h1>
            <p>Идеальная архитектура</p>
        </section>
    </div>

    <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 3, 7); 
        camera.lookAt(0, 0.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Свет (сделал ярче, чтобы машина блестела)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xff00cc, 4);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const dirLight2 = new THREE.DirectionalLight(0x3333ff, 4);
        dirLight2.position.set(-5, 5, 5);
        scene.add(dirLight2);

        // --- СОЗДАЕМ МАШИНУ (БОЛЕЕ ГЛАДКУЮ) ---
        const carGroup = new THREE.Group();
        const parts = [];

        function createPart(geometry, color, x, y, z, rx = 0, ry = 0, rz = 0) {
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.1,
                metalness: 1.0, // Максимальный блеск
            });
            const mesh = new THREE.Mesh(geometry, mat);
            mesh.position.set(x, y, z);
            mesh.rotation.set(rx, ry, rz);
            mesh.userData.originalPos = new THREE.Vector3(x, y, z);
            
            carGroup.add(mesh);
            parts.push(mesh);
            return mesh;
        }

        // 1. Корпус (сглаженный куб)
        const bodyGeom = new THREE.BoxGeometry(4.5, 0.6, 2.2);
        createPart(bodyGeom, 0xff00cc, 0, 0.5, 0);

        // 2. Кабина (сглаженная)
        const cabinGeom = new THREE.BoxGeometry(2.2, 0.7, 1.8);
        // Скашиваем верхнюю часть
        const posAttribute = cabinGeom.attributes.position;
        for (let i = 0; i < posAttribute.count; i++) {
            if (posAttribute.getY(i) > 0) {
                posAttribute.setX(i, posAttribute.getX(i) * 0.6);
                posAttribute.setZ(i, posAttribute.getZ(i) * 0.7);
            }
        }
        cabinGeom.computeVertexNormals();
        createPart(cabinGeom, 0x111111, -0.5, 1.15, 0);

        // 3. Капот (скошенный)
        const hoodGeom = new THREE.BoxGeometry(1.8, 0.2, 2.0);
        createPart(hoodGeom, 0x3333ff, 1.8, 0.9, 0, 0, 0, -0.1);

        // 4. Колеса (гладкие цилиндры с дисками)
        const wheelGeom = new THREE.CylinderGeometry(0.6, 0.6, 0.3, 32);
        const discGeom = new THREE.CylinderGeometry(0.4, 0.4, 0.32, 32); // Серебристый диск

        // Левое переднее
        createPart(wheelGeom, 0x000000, 1.3, 0, 1.2, Math.PI/2, 0, 0);
        createPart(discGeom, 0xaaaaaa, 1.3, 0, 1.2, Math.PI/2, 0, 0);
        // Правое переднее
        createPart(wheelGeom, 0x000000, 1.3, 0, -1.2, Math.PI/2, 0, 0);
        createPart(discGeom, 0xaaaaaa, 1.3, 0, -1.2, Math.PI/2, 0, 0);
        // Левое заднее
        createPart(wheelGeom, 0x000000, -1.3, 0, 1.2, Math.PI/2, 0, 0);
        createPart(discGeom, 0xaaaaaa, -1.3, 0, 1.2, Math.PI/2, 0, 0);
        // Правое заднее
        createPart(wheelGeom, 0x000000, -1.3, 0, -1.2, Math.PI/2, 0, 0);
        createPart(discGeom, 0xaaaaaa, -1.3, 0, -1.2, Math.PI/2, 0, 0);

        carGroup.position.y = -0.5; 
        scene.add(carGroup);

        // Вращение в простое
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (window.scrollY < 100) {
                carGroup.rotation.y = elapsedTime * 0.3;
            }

            renderer.render(scene, camera);
        }
        animate();

        // --- БЫСТРАЯ ПРЕЗЕНТАЦИЯ (МГНОВЕННЫЙ SNAP) ---
        
        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: ".content",
                start: "top top",
                end: "bottom bottom",
                scrub: 0.2, // Очень быстрый отклик на скролл
                snap: {
                    snapTo: 1 / 2, // Привязка к 3 экранам (0, 0.5, 1)
                    duration: { min: 0.1, max: 0.3 }, // Очень быстрое переключение
                    delay: 0.05,
                    ease: "power1.inOut"
                }
            }
        });

        // 1. Разборка (сразу)
        tl.to(parts.map(p => p.position), {
            x: (i) => parts[i].position.x * 2.5 + (Math.random() - 0.5) * 2,
            y: (i) => parts[i].position.y * 2.5 + (Math.random() - 0.5) * 2,
            z: (i) => parts[i].position.z * 2.5 + (Math.random() - 0.5) * 2,
            rotationX: () => Math.random() * Math.PI,
            rotationY: () => Math.random() * Math.PI,
            ease: "power1.inOut"
        }, 0)
        
        .to(carGroup.rotation, {
            y: Math.PI * 2,
            ease: "power1.inOut"
        }, 0)

        // 2. Сборка обратно (сразу)
        .to(parts.map(p => p.position), {
            x: (i) => parts[i].userData.originalPos.x,
            y: (i) => parts[i].userData.originalPos.y,
            z: (i) => parts[i].userData.originalPos.z,
            rotationX: 0,
            rotationY: 0,
            ease: "power1.inOut"
        }, 1)
        .to(carGroup.rotation, {
            y: Math.PI * 4,
            ease: "power1.inOut"
        }, 1);

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
