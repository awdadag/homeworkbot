<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Explode Scroll</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050510; 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Контейнер для 3D */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Текстовые блоки */
        .content {
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        .section {
            height: 150vh; /* Длинные секции для скролла */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .section h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(3rem, 10vw, 8rem);
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, #555 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section p {
            font-size: 1.5rem;
            color: #ff00cc;
            letter-spacing: 5px;
            margin-top: 20px;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0; /* Скрыты до скролла */
            transform: translateY(30px);
            transition: all 0.5s;
        }

        /* Кнопка */
        .btn {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 60px;
            font-family: 'Unbounded', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(90deg, #ff00cc, #3333ff);
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 40px rgba(255, 0, 204, 0.6);
            z-index: 10;
            pointer-events: auto;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 0 80px rgba(255, 0, 204, 1);
        }
    </style>
</head>
<body>

    <a href="https://t.me/HomeworkHelper_1bot" class="btn" target="_blank">ЗАПИСАТЬСЯ</a>

    <div id="canvas-container"></div>

    <div class="content">
        <section class="section">
            <h1>NAIL STUDIO</h1>
            <p id="text-1">Начало производства</p>
        </section>

        <section class="section">
            <h1>ПРЕМИУМ</h1>
            <p id="text-2">Каждая деталь важна</p>
        </section>

        <section class="section">
            <h1>СБОРКА</h1>
            <p id="text-3">Идеальная архитектура</p>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xff00cc, 2);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const dirLight2 = new THREE.DirectionalLight(0x3333ff, 2);
        dirLight2.position.set(-5, -5, 5);
        scene.add(dirLight2);

        // --- СОЗДАЕМ КУБ ИЗ МНОЖЕСТВА МАЛЕНЬКИХ КУБИКОВ ---
        const group = new THREE.Group();
        const cubeSize = 0.5;
        const gap = 0.55;
        const count = 5; // 5x5x5 = 125 кубиков

        for (let x = 0; x < count; x++) {
            for (let y = 0; y < count; y++) {
                for (let z = 0; z < count; z++) {
                    const geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
                    const material = new THREE.MeshStandardMaterial({
                        color: 0xffffff,
                        roughness: 0.2,
                        metalness: 0.8,
                        emissive: 0x220033
                    });
                    const cube = new THREE.Mesh(geometry, material);
                    
                    // Позиция внутри куба
                    cube.position.set(
                        (x - count/2) * gap,
                        (y - count/2) * gap,
                        (z - count/2) * gap
                    );
                    
                    // Сохраняем изначальные позиции для сборки
                    cube.userData.originalPos = cube.position.clone();
                    // Задаем случайное направление для разлета
                    cube.userData.explodeDir = new THREE.Vector3(
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 20
                    );

                    group.add(cube);
                }
            }
        }
        scene.add(group);

        // Вращение всей группы
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Вращение, если куб собран
            group.rotation.y = elapsedTime * 0.2;
            group.rotation.x = elapsedTime * 0.1;

            renderer.render(scene, camera);
        }
        animate();

        // --- АНИМАЦИЯ РАЗБОРКИ (SCROLL) ---
        
        // 1. Начинаем разлетаться, когда скроллим первую секцию
        gsap.to(group.children.map(c => c.position), {
            scrollTrigger: {
                trigger: ".section:nth-child(1)",
                start: "top top",
                end: "bottom top",
                scrub: 1
            },
            x: (i, target) => group.children[i].userData.explodeDir.x,
            y: (i, target) => group.children[i].userData.explodeDir.y,
            z: (i, target) => group.children[i].userData.explodeDir.z,
            rotationX: 360,
            rotationY: 360,
            ease: "power2.inOut"
        });

        // Появление текста
        gsap.to("#text-1", {
            scrollTrigger: {
                trigger: ".section:nth-child(1)",
                start: "top center",
                end: "bottom center",
                scrub: true
            },
            opacity: 1,
            y: 0
        });

        // 2. Собираем обратно на второй секции
        gsap.to(group.children.map(c => c.position), {
            scrollTrigger: {
                trigger: ".section:nth-child(2)",
                start: "top center",
                end: "bottom top",
                scrub: 1
            },
            x: (i) => group.children[i].userData.originalPos.x,
            y: (i) => group.children[i].userData.originalPos.y,
            z: (i) => group.children[i].userData.originalPos.z,
            rotationX: 0,
            rotationY: 0,
            ease: "power2.inOut"
        });

        gsap.to("#text-2", {
            scrollTrigger: {
                trigger: ".section:nth-child(2)",
                start: "top center",
                end: "bottom center",
                scrub: true
            },
            opacity: 1,
            y: 0
        });

        // 3. Финальный текст
        gsap.to("#text-3", {
            scrollTrigger: {
                trigger: ".section:nth-child(3)",
                start: "top center",
                end: "bottom center",
                scrub: true
            },
            opacity: 1,
            y: 0
        });

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
